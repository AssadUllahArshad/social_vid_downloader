# Apply with: docker compose -f docker-compose.yml -f docker-compose.production.yml ...
# Secrets remain in an owner-only .env; no default production credentials.
x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a generated production password}
    restart: unless-stopped
    logging: *bounded-logging
    mem_limit: 1g
    pids_limit: 128
    stop_grace_period: 60s
  redis:
    restart: unless-stopped
    logging: *bounded-logging
    mem_limit: 256m
    pids_limit: 64
    # Reject writes instead of evicting active job/rate-limit reservations.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
  migrate:
    logging: *bounded-logging
    environment:
      ENVIRONMENT: production
      STATE_BACKEND: redis
      DATABASE_URL: postgresql+psycopg://socialvid:${POSTGRES_PASSWORD:?Set a generated production password}@postgres:5432/socialvid
      IP_HASH_SECRET: ${IP_HASH_SECRET:?Set a separate random secret}
  api:
    logging: *bounded-logging
    environment:
      ENVIRONMENT: production
      STATE_BACKEND: redis
      DATABASE_URL: postgresql+psycopg://socialvid:${POSTGRES_PASSWORD:?Set a generated production password}@postgres:5432/socialvid
      IP_HASH_SECRET: ${IP_HASH_SECRET:?Set a separate random secret}
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 5m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).close()"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
  web:
    logging: *bounded-logging
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 128
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('node:http'); const r=http.get('http://127.0.0.1:3000/',{headers:{Host:'socialviddownloader.com'}},s=>{s.resume();process.exit(s.statusCode===200?0:1)});r.setTimeout(5000,()=>{r.destroy();process.exit(1)});r.on('error',()=>process.exit(1));"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
    depends_on:
      api: {condition: service_healthy}
